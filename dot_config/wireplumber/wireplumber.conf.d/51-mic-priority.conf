# Preferred microphone order: Sony headset first, Blue Snowball as fallback
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_input.usb-Sony_Interactive_Entertainment_Wireless_Headset-00.mono-fallback" }
    ]
    actions = {
      update-props = {
        priority.session = 3000
        priority.driver = 3000
      }
    }
  }
  {
    matches = [
      { node.name = "alsa_input.usb-BLUE_MICROPHONE_Blue_Snowball_SUGA_2021_01_26_01099-00.mono-fallback" }
    ]
    actions = {
      update-props = {
        priority.session = 2500
        priority.driver = 2500
      }
    }
  }
]
