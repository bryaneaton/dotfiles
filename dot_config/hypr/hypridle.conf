general {
    lock_cmd = pidof hyprlock || hyprlock   # dedupe: only start hyprlock if it isn't already running
    before_sleep_cmd = loginctl lock-session # make sure we're locked before the system actually suspends
    after_sleep_cmd = hyprctl dispatch dpms on # avoid needing to press a key twice to wake the display
    ignore_dbus_inhibit = false             # whether to ignore dbus-sent idle-inhibit requests (used by e.g. firefox or steam)
}

listener {
    timeout = 300                            # 5 minutes
    on-timeout = loginctl lock-session       # goes through general.lock_cmd above -> deduped hyprlock
}

listener {
    timeout = 330                            # 5.5 minutes (shortly after lock)
    on-timeout = hyprctl dispatch dpms off   # command to run when timeout has passed
    on-resume = hyprctl dispatch dpms on && ~/.config/hypr/scripts/internet.sh    # command to run when activity is detected after timeout has fired.
}

